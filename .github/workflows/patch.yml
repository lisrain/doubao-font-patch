name: Build Patched APK

on:
  schedule:
    # 每天北京时间 04:00 检查（UTC 20:00）
    - cron: '0 20 * * *'
  workflow_dispatch:  # 手动触发

env:
  API_URL: https://shurufa.doubao.com/api/v1/app/download_url?platform=android
  SMALI_VERSION: "3.0.9"

jobs:
  check-and-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Android SDK (apksigner)
        uses: android-actions/setup-android@v4

      - name: Download smali/baksmali ${{ env.SMALI_VERSION }}
        run: |
          curl -sL -o /tmp/baksmali.jar \
            "https://github.com/baksmali/smali/releases/download/${{ env.SMALI_VERSION }}/baksmali-${{ env.SMALI_VERSION }}-fat.jar"
          curl -sL -o /tmp/smali.jar \
            "https://github.com/baksmali/smali/releases/download/${{ env.SMALI_VERSION }}/smali-${{ env.SMALI_VERSION }}-fat.jar"
          ls -lh /tmp/baksmali.jar /tmp/smali.jar
          java -jar /tmp/baksmali.jar --version
          java -jar /tmp/smali.jar --version

      - name: Check for new version
        id: check
        run: |
          RESP=$(curl -s "$API_URL" \
            -H "accept: */*" \
            -H "referer: https://shurufa.doubao.com/h5" \
            -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")

          echo "API response: $RESP"

          VERSION=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['version_name'])")
          VERSION_CODE=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['version_code'])")
          URL=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['url'])")
          FILENAME=$(basename "$URL")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

          # 检查是否已有此版本的 release
          TAG="v${VERSION}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $TAG already released, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "New version found: $TAG (code: $VERSION_CODE)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download original APK
        if: steps.check.outputs.exists == 'false'
        run: |
          curl -L -o "${{ steps.check.outputs.filename }}" "${{ steps.check.outputs.url }}"
          ls -lh "${{ steps.check.outputs.filename }}"

      - name: Decode signing keystore
        if: steps.check.outputs.exists == 'false'
        run: |
          if [ -n "${{ secrets.ANDROID_SIGN_KEYSTORE }}" ]; then
            echo "${{ secrets.ANDROID_SIGN_KEYSTORE }}" | base64 -d > /tmp/debug.keystore
            echo "Using stored keystore"
          else
            keytool -genkey -v \
              -keystore /tmp/debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated temporary debug keystore"
          fi

      - name: Patch APK
        if: steps.check.outputs.exists == 'false'
        run: |
          OUTPUT="doubaoime_${{ steps.check.outputs.version }}_系统字体版.apk"
          BAKSMALI_JAR=/tmp/baksmali.jar SMALI_JAR=/tmp/smali.jar \
            python3 patch/ci-patch.py \
              "${{ steps.check.outputs.filename }}" \
              "$OUTPUT" \
              --keystore /tmp/debug.keystore
          echo "output_file=$OUTPUT" >> "$GITHUB_OUTPUT"
        id: patch

      - name: Upload artifact (temporary storage)
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: doubaoime-${{ steps.check.outputs.version }}-patched
          path: ${{ steps.patch.outputs.output_file }}
          retention-days: 90

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.check.outputs.version }}"
          OUTPUT="${{ steps.patch.outputs.output_file }}"
          VERSION="${{ steps.check.outputs.version }}"
          VC="${{ steps.check.outputs.version_code }}"

          cat > /tmp/release_body.md << EOF
          ## 豆包输入法 ${VERSION} - 系统字体版

          基于官方 v${VERSION} (version_code: ${VC}) 打补丁。

          ### 修改内容

          - 移除 \`updateIsSupportSystemFont()\` 调用
          - 将所有非图标字体（qihei、misans 等）替换为系统字体 (\`Typeface.create\`)
          - 保留图标字体 (oimeui2023/oimeui2025) 和皮肤字体 (.ttf)

          ### 签名

          使用 Android Debug 证书签名（V1+V2+V3），可直接安装。

          > 如安装失败，请用 MT 管理器等工具重新签名后安装。
          EOF

          gh release create "$TAG" \
            "$OUTPUT" \
            --title "v${VERSION} 系统字体版" \
            --notes-file /tmp/release_body.md \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "### Already up to date" >> "$GITHUB_STEP_SUMMARY"
            echo "Version **${{ steps.check.outputs.version }}** already has a release." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.check.outputs.exists }}" = "false" ]; then
            echo "### Release created" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Version**: ${{ steps.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **File**: ${{ steps.patch.outputs.output_file }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Tag**: v${{ steps.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact**: [Download from workflow artifacts](../actions)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Check failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Could not determine version status." >> "$GITHUB_STEP_SUMMARY"
          fi
