name: Build Patched APK

on:
  schedule:
    # 每天北京时间 04:00 检查（UTC 20:00）
    - cron: '0 20 * * *'
  workflow_dispatch:  # 手动触发

env:
  API_URL: https://shurufa.doubao.com/api/v1/app/download_url?platform=android
  SMALI_VERSION: "3.0.9"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.version.outputs.exists }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      url: ${{ steps.version.outputs.url }}
      filename: ${{ steps.version.outputs.filename }}
    steps:
      - name: Check for new version
        id: version
        run: |
          RESP=$(curl -s "$API_URL" \
            -H "accept: */*" \
            -H "referer: https://shurufa.doubao.com/h5" \
            -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")

          echo "API response: $RESP"

          VERSION=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); v=d['data']['version_name']; print(v.lstrip('vV'))")
          VERSION_CODE=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['version_code'])")
          URL=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['url'])")
          FILENAME=$(basename "$URL")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

          TAG="v${VERSION}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $TAG already released, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "New version found: $TAG (code: $VERSION_CODE)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  patch:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    outputs:
      output_file: ${{ steps.patch.outputs.output_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Android SDK (apksigner)
        uses: android-actions/setup-android@v4

      - name: Download smali/baksmali ${{ env.SMALI_VERSION }}
        run: |
          curl -sL -o /tmp/baksmali.jar \
            "https://github.com/baksmali/smali/releases/download/${{ env.SMALI_VERSION }}/baksmali-${{ env.SMALI_VERSION }}-fat.jar"
          curl -sL -o /tmp/smali.jar \
            "https://github.com/baksmali/smali/releases/download/${{ env.SMALI_VERSION }}/smali-${{ env.SMALI_VERSION }}-fat.jar"
          java -jar /tmp/baksmali.jar --version
          java -jar /tmp/smali.jar --version

      - name: Download original APK
        run: |
          curl -L -o "${{ needs.check.outputs.filename }}" "${{ needs.check.outputs.url }}"
          ls -lh "${{ needs.check.outputs.filename }}"

      - name: Decode signing keystore
        run: |
          if [ -n "${{ secrets.ANDROID_SIGN_KEYSTORE }}" ]; then
            echo "${{ secrets.ANDROID_SIGN_KEYSTORE }}" | base64 -d > /tmp/debug.keystore
            echo "Using stored keystore"
          else
            keytool -genkey -v \
              -keystore /tmp/debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated temporary debug keystore"
          fi

      - name: Patch APK
        run: |
          OUTPUT="doubaoime-${{ needs.check.outputs.version }}-fontpatch.apk"
          BAKSMALI_JAR=/tmp/baksmali.jar SMALI_JAR=/tmp/smali.jar \
            python3 patch/ci-patch.py \
              "${{ needs.check.outputs.filename }}" \
              "$OUTPUT" \
              --keystore /tmp/debug.keystore
          echo "output_file=$OUTPUT" >> "$GITHUB_OUTPUT"
        id: patch

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: doubaoime-${{ needs.check.outputs.version }}-patched
          path: ${{ steps.patch.outputs.output_file }}
          retention-days: 90

  release:
    needs: [check, patch]
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: doubaoime-${{ needs.check.outputs.version }}-patched

      - name: Create GitHub Release
        run: |
          TAG="v${{ needs.check.outputs.version }}"
          VERSION="${{ needs.check.outputs.version }}"
          VC="${{ needs.check.outputs.version_code }}"
          OUTPUT=$(ls *.apk)

          cat > /tmp/release_body.md << EOF
          ## 豆包输入法 ${VERSION} - 系统字体版

          基于官方 v${VERSION} (version_code: ${VC}) 打补丁。

          ### 修改内容

          - 移除 \`updateIsSupportSystemFont()\` 调用
          - 将所有非图标字体（qihei、misans 等）替换为系统字体 (\`Typeface.create\`)
          - 保留图标字体 (oimeui2023/oimeui2025) 和皮肤字体 (.ttf)

          ### 签名

          使用 Android Debug 证书签名（V1+V2+V3），可直接安装。

          > 如安装失败，请用 MT 管理器等工具重新签名后安装。
          EOF

          gh release create "$TAG" \
            "$OUTPUT" \
            --title "v${VERSION} 系统字体版" \
            --notes-file /tmp/release_body.md \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
