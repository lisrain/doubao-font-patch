name: Build Patched APK

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/patch.yml"
      - "patch/**"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/patch.yml"
      - "patch/**"
      - "README.md"
  schedule:
    # 每天北京时间 04:00 检查（UTC 20:00）
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "构建成功后发布当前补丁版本"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: doubao-patch-${{ github.ref }}
  cancel-in-progress: false

env:
  API_URL: https://shurufa.doubao.com/api/v1/app/download_url?platform=android
  ANDROID_BUILD_TOOLS: "35.0.0"
  SMALI_VERSION: "3.0.9"
  BAKSMALI_SHA256: 1b206070701b2145bd1e6204abd6c14fea877f335486845cd4df149bf5f79c2e
  SMALI_SHA256: b5e2aa019c49ddaf7b2cace80f60ebbfd61f7ac18e7a3dea1075bec8779cc37a

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      url: ${{ steps.meta.outputs.url }}
      filename: ${{ steps.meta.outputs.filename }}
      tag: ${{ steps.meta.outputs.tag }}
      should_build: ${{ steps.meta.outputs.should_build }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Resolve official APK and build policy
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_RELEASE: ${{ inputs.release || 'false' }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            -H "accept: */*" \
            -H "referer: https://shurufa.doubao.com/h5" \
            -H "user-agent: Mozilla/5.0 GitHub-Actions" \
            "$API_URL" > "$response_file"

          code="$(jq -r '.code' "$response_file")"
          if [ "$code" != "0" ]; then
            jq . "$response_file"
            echo "Doubao download API returned code=$code" >&2
            exit 1
          fi

          raw_version="$(jq -r '.data.version_name' "$response_file")"
          version="${raw_version#[vV]}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "官方版本格式不符合 x.xx.x: $raw_version" >&2
            exit 1
          fi
          version_code="$(jq -r '.data.version_code' "$response_file")"
          url="$(jq -r '.data.url' "$response_file")"
          filename="$(basename "${url%%\?*}")"
          tag="v${version}"

          exists=false
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            exists=true
          fi

          should_build=false
          should_release=false
          case "$EVENT_NAME" in
            push|pull_request)
              should_build=true
              ;;
            schedule)
              if [ "$exists" = false ]; then
                should_build=true
                should_release=true
              fi
              ;;
            workflow_dispatch)
              should_build=true
              if [ "$REQUEST_RELEASE" = true ] && [ "$exists" = false ]; then
                should_release=true
              fi
              ;;
          esac

          {
            echo "version=$version"
            echo "version_code=$version_code"
            echo "url=$url"
            echo "filename=$filename"
            echo "tag=$tag"
            echo "should_build=$should_build"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"

          echo "Official version: $version ($version_code)"
          echo "Release tag: $tag (exists=$exists)"
          echo "Build=$should_build Release=$should_release"

  build:
    needs: metadata
    if: needs.metadata.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.names.outputs.artifact_name }}
      output_file: ${{ steps.names.outputs.output_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Download smali tools
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/smali-tools"
          mkdir -p "$tool_dir"

          curl --fail --show-error --location \
            --retry 3 --retry-all-errors \
            --output "$tool_dir/baksmali.jar" \
            "https://github.com/baksmali/smali/releases/download/${SMALI_VERSION}/baksmali-${SMALI_VERSION}-fat-release.jar"
          curl --fail --show-error --location \
            --retry 3 --retry-all-errors \
            --output "$tool_dir/smali.jar" \
            "https://github.com/baksmali/smali/releases/download/${SMALI_VERSION}/smali-${SMALI_VERSION}-fat-release.jar"

          echo "$BAKSMALI_SHA256  $tool_dir/baksmali.jar" | sha256sum --check --strict
          echo "$SMALI_SHA256  $tool_dir/smali.jar" | sha256sum --check --strict
          java -jar "$tool_dir/baksmali.jar" --version
          java -jar "$tool_dir/smali.jar" --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Download original APK
        run: |
          set -euo pipefail
          curl --fail --show-error --location \
            --retry 3 --retry-all-errors \
            --output "${{ needs.metadata.outputs.filename }}" \
            "${{ needs.metadata.outputs.url }}"
          test -s "${{ needs.metadata.outputs.filename }}"
          ls -lh "${{ needs.metadata.outputs.filename }}"

      - name: Prepare signing keystore
        env:
          ANDROID_SIGN_KEYSTORE: ${{ secrets.ANDROID_SIGN_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_SIGN_KEYSTORE" ]; then
            printf '%s' "$ANDROID_SIGN_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
            echo "Using repository signing keystore"
          else
            keytool -genkeypair -noprompt \
              -keystore "$RUNNER_TEMP/debug.keystore" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "ANDROID_SIGN_KEYSTORE is unset; generated an ephemeral debug keystore"
          fi

      - name: Set output names
        id: names
        run: |
          output_file="doubaoime-${{ needs.metadata.outputs.version }}-fontpatch-association.apk"
          artifact_name="doubaoime-${{ needs.metadata.outputs.version }}-patched"
          echo "output_file=$output_file" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Patch and sign APK
        env:
          BAKSMALI_JAR: ${{ runner.temp }}/smali-tools/baksmali.jar
          SMALI_JAR: ${{ runner.temp }}/smali-tools/smali.jar
        run: |
          set -euo pipefail
          export APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          uv run --python 3.12 patch/ci-patch.py \
            "${{ needs.metadata.outputs.filename }}" \
            "${{ steps.names.outputs.output_file }}" \
            --keystore "$RUNNER_TEMP/debug.keystore"

      - name: Verify output APK
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.names.outputs.output_file }}"
          sha256sum "${{ steps.names.outputs.output_file }}" | tee "${{ steps.names.outputs.output_file }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: |
            ${{ steps.names.outputs.output_file }}
            ${{ steps.names.outputs.output_file }}.sha256
          if-no-files-found: error
          retention-days: 90

  release:
    needs: [metadata, build]
    if: needs.metadata.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## 修改内容

          - 将 qihei、misans 等非图标字体替换为系统字体
          - 保留 oimeui2023、oimeui2025 图标字体及皮肤 `.ttf` 字体
          - 在“设置 → 智能联想”中加入“英文单词补全联想”开关，默认开启
          - 关闭开关后禁用英文 native association，并阻止光标触发单词补全
          - 修复 `claude-opus-4` 等英文标识符切换数字/符号键盘后被覆盖或整段候选重复追加

          ## 签名

          APK 已通过 `apksigner verify` 的 V2/V3 签名验证，附件同时提供 SHA-256 文件。
          EOF

          gh release create "${{ needs.metadata.outputs.tag }}" \
            "${{ needs.build.outputs.output_file }}" \
            "${{ needs.build.outputs.output_file }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "豆包输入法 ${{ needs.metadata.outputs.version }} 补丁版" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
